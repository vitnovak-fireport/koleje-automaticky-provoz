<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f43">
<title>Zahradní železnice – živě</title>
<link rel="stylesheet" href="/static/styl.css">
</head>
<body>
<main>
  <h1>Zahradní železnice – živě</h1>
  <div class="chips">
    <span class="chip" id="chip-provoz">Provoz …</span>
    <span class="chip" id="chip-zastavka">Zastávka …</span>
    <span class="chip hidden off" id="chip-spojeni">Spojení ztraceno</span>
  </div>

  <section class="card">
    <div class="faze" id="faze">Načítám…</div>
  </section>

  <section class="card">
    <h2>Segmenty</h2>
    <div class="segmenty">
      <div class="seg" id="seg-1"><b>1</b><span>Okruh</span></div>
      <div class="seg" id="seg-2"><b>2</b><span>Okruh se zastávkou</span></div>
      <div class="seg" id="seg-3"><b>3</b><span>Stanice</span></div>
      <div class="seg" id="seg-4"><b>4</b><span>Stanice</span></div>
    </div>
  </section>

  <section class="card">
    <h2>Lokomotivy na kolejišti</h2>
    <div id="lokomotivy"></div>
  </section>

  <section class="card">
    <h2>Co se děje</h2>
    <div class="log" id="log"></div>
  </section>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  let posledniLog = "";

  function vykresli(s) {
    $("chip-spojeni").classList.add("hidden");
    $("chip-provoz").textContent = s.bezi ? "Provoz běží" : "Provoz stojí";
    $("chip-provoz").className = "chip " + (s.bezi ? "on" : "");
    $("chip-zastavka").textContent = s.zastavka_povolena ? "Zastávka v provozu" : "Zastávka mimo provoz";
    $("faze").textContent = s.faze;

    for (const [id, obsazeno] of Object.entries(s.segmenty)) {
      const el = $("seg-" + id);
      if (el) el.classList.toggle("obsazeno", obsazeno);
    }

    $("lokomotivy").replaceChildren(...s.lokomotivy.map((l) => {
      const radek = document.createElement("div");
      radek.className = "loko";
      const jmeno = document.createElement("b");
      jmeno.textContent = `${l.jmeno} (${l.adresa})`;
      const info = document.createElement("span");
      info.className = "muted";
      info.textContent = `vyjíždí z koleje ${l.kolej} · ` + (l.rychlost > 0 ? `jede (rychlost ${l.rychlost})` : "stojí");
      radek.append(jmeno, info);
      return radek;
    }));

    const zpravy = s.log.filter(([, zprava]) => !zprava.startsWith("->"));
    const logText = JSON.stringify(zpravy);
    if (logText !== posledniLog) {
      posledniLog = logText;
      $("log").replaceChildren(...zpravy.slice().reverse().map(([cas, zprava]) => {
        const div = document.createElement("div");
        const t = document.createElement("time");
        t.textContent = cas;
        div.append(t, zprava);
        return div;
      }));
    }
  }

  async function obnov() {
    try {
      const r = await fetch("/api/stav", { cache: "no-store" });
      vykresli(await r.json());
    } catch (e) {
      $("chip-spojeni").classList.remove("hidden");
    }
  }

  obnov();
  setInterval(obnov, 1000);
</script>
</body>
</html>
